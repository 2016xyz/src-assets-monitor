version: '3.8'

services:
  app:
    image: php:8.2-fpm-alpine
    container_name: src_monitor_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: src_monitor_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: src_monitor_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: src_monitor
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: src_monitor_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
